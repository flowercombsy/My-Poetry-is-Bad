<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Poems</title>
<meta name="theme-color" content="#0b0b0a">

<link rel="icon" type="image/png" href="images/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=EB+Garamond:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">

<link rel="stylesheet" href="styles/main.css">
<link rel="stylesheet" href="styles/detail-page.css">
<link rel="stylesheet" href="styles/playlist.css">
</head>
<body>

<button class="playlist-tab" id="playlist-tab">♪ Playlist</button>

<div class="playlist-panel" id="playlist-panel">
  <h3>Playlist</h3>

  <div class="volume-control">
    <span>🎵</span>
    <input type="range" id="volume-slider" min="0" max="1" step="0.01" value="0.8">
  </div>

  <div class="playlist-columns">
    <div class="playlist-column-wrap">
      <h4>Playlist</h4>
      <div class="track-list" id="playlist-column"></div>
    </div>
    <div class="divider"></div>
    <div class="playlist-column-wrap">
      <h4>Songs</h4>
      <div class="track-list" id="songs-column"></div>
    </div>
  </div>

  <p class="playlist-note">"+" adds a song to your Playlist, "−" removes it, drag to reorder.
Credits: <a href="https://www.youtube.com/@Seycara" target="_blank" rel="noopener">@Seycara</a></p>
</div>

<main class="detail-main">
  <a href="index.html" class="detail-back">&larr; Back</a>

  <div class="detail-title-box">
    <h1 id="detail-title" class="detail-title"></h1>
  </div>

  <div class="detail-header">
    <img id="detail-cover" class="detail-cover" src="" alt="">
    <div class="detail-info">
      <span id="detail-category" class="detail-category-badge"></span>
      <div class="category-switch">
        <a href="index.html#story" class="category-switch-link current">Story</a>
        <a href="index.html#poems" class="category-switch-link">Poems</a>
      </div>
      <span id="detail-date" class="detail-date"></span>
    </div>
  </div>

  <p id="detail-body" class="detail-body"></p>
</main>

<footer>
  Updated as new poems are written.
</footer>

<script src="scripts/content/stories.js"></script>

<script src="scripts/player/songs-library.js"></script>
<script src="scripts/player/playlist-store.js"></script>
<script src="scripts/player/player-core.js"></script>
<script src="scripts/player/player-ui.js"></script>

<script src="scripts/pages/detail.js"></script>
<script>
  renderDetailPage(stories, "Story");
</script>

</body>
</html>
