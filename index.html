<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Poems</title>

<meta name="description" content="A small collection of poems that I have written">
<meta property="og:type" content="website">
<meta property="og:title" content="The Final Light">
<meta property="og:description" content="A small collection of poems that I have written">
<meta property="og:url" content="https://flowercombsy.github.io/My-Poetry-is-Bad/">
<meta property="og:image" content="https://flowercombsy.github.io/My-Poetry-is-Bad/images/preview.png">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="The Final Light">
<meta name="twitter:description" content="A small collection of poems and the stories behind them.">
<meta name="twitter:image" content="https://flowercombsy.github.io/My-Poetry-is-Bad/images/preview.png">
<meta name="theme-color" content="#0b0b0a">

<link rel="icon" type="image/png" href="images/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=EB+Garamond:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">

<!-- styles, split by what they're responsible for -->
<link rel="stylesheet" href="styles/main.css">
<link rel="stylesheet" href="styles/entries.css">
<link rel="stylesheet" href="styles/playlist.css">
</head>
<body>

<button class="playlist-tab" id="playlist-tab">♪ Playlist</button>

<div class="playlist-panel" id="playlist-panel">
  <h3>Playlist</h3>

  <div class="volume-control">
    <span>🎵</span>
    <input type="range" id="volume-slider" min="0" max="1" step="0.01" value="0.8">
  </div>

  <div class="playlist-columns">
    <div class="playlist-column-wrap">
      <h4>Playlist</h4>
      <div class="track-list" id="playlist-column"></div>
    </div>
    <div class="divider"></div>
    <div class="playlist-column-wrap">
      <h4>Songs</h4>
      <div class="track-list" id="songs-column"></div>
    </div>
  </div>

  <p class="playlist-note">Drag rows in your Playlist to reorder them. "+" adds a song, "−" removes it.
Credits: <a href="https://www.youtube.com/@Seycara" target="_blank" rel="noopener">@Seycara</a></p>
</div>

<header>
  <h1>My final light</h1>
  <p>Old ones are down there, The new ones are up here.</p>
</header>

<main>

  <!--story column (left)-->
  <section id="story">
    <div class="section-heading">
      <img src="images/story-cover.png" alt="" class="section-icon">
      <h2>Story</h2>
    </div>
    <div class="entry-list" id="story-list"></div>
  </section>

  <div class="divider"></div>

  <!--poems column (right)-->
  <section id="poems">
    <div class="poems-header">
      <div class="section-heading">
        <img src="images/poem-cover.png" alt="" class="section-icon">
        <h2>Poems</h2>
      </div>
      <input type="text" id="poem-search" class="poem-search" placeholder="Search titles…" aria-label="Search poem titles">
    </div>
    <div class="entry-list" id="poem-list"></div>
  </section>

</main>

<footer>
  Updated as new poems are written.
</footer>

<!-- content — this is what to edit to add poems/stories -->
<script src="scripts/content/stories.js"></script>
<script src="scripts/content/poems.js"></script>

<!-- player — the music engine + its on-screen panel -->
<script src="scripts/player/songs-library.js"></script>
<script src="scripts/player/playlist-store.js"></script>
<script src="scripts/player/player-core.js"></script>
<script src="scripts/player/player-ui.js"></script>

<!-- this page's own rendering -->
<script src="scripts/pages/home.js"></script>

</body>
</html>
