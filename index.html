    padding:0;
    background: var(--bg);

  body{

  }

  header{

    font-weight: 600;
    font-style: italic;
    font-size: clamp(2.6rem, 6vw, 4.2rem);

    color: var(--ink-dim);

  .divider{

  section{

    font-weight: 600;
    font-style: italic;

  .entry{

  }

  .entry:last-child{
    border-bottom: 1px solid var(--hair);
  }

    width: 100%;
    background: none;
    border: none;
    color: inherit;
    font-family: inherit;
    text-align: left;
    cursor: pointer;
    padding: 1.4rem 0.2rem;
    display: flex;
    align-items: baseline;
    gap: 1.2rem;
    position: relative;
  }

  .entry-row:focus-visible{
    outline: 1px solid var(--brass);
    outline-offset: 4px;
  }

  .entry-mark{
    flex: none;
    width: 0.7rem;
    color: var(--brass);
    font-size: 1.1rem;
    transform: rotate(0deg);
    transition: transform 0.35s ease;
    line-height: 1;
    margin-top: 0.15rem;
  }

  .entry.open .entry-mark{
    transform: rotate(90deg);
  }

  .entry-heading{
    flex: 1;
    min-width: 0;
  }

  .entry-title{
    font-family: "Cormorant Garamond", serif;
    font-style: italic;
    font-size: 1.5rem;
    font-weight: 600;
    display: block;
  }

  .entry-preview{
    color: var(--ink-dim);
    font-size: 0.98rem;
    display: block;
    margin-top: 0.15rem;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    transition: opacity 0.25s ease;
  }

  .entry.open .entry-preview{
    opacity: 0;
  }

  .entry-date{
    flex: none;
    color: var(--ink-dim);
    font-size: 0.92rem;
    font-variant-numeric: oldstyle-nums;
  }

  .entry-body-wrap{
    display: grid;
    grid-template-rows: 0fr;
    transition: grid-template-rows 0.5s cubic-bezier(0.22, 1, 0.36, 1);
  }

  .entry.open .entry-body-wrap{
    grid-template-rows: 1fr;
  }

  .entry-body-inner{
    overflow: hidden;
  }

  .entry-body{
    margin: 0 0 2rem;
    padding: 0 0 0 1.9rem;
    white-space: pre-line;
    font-size: 1.15rem;
    line-height: 1.85;
    color: #ded8ca;
    opacity: 0;
    transform: translateY(-6px);
    transition: opacity 0.4s ease 0.08s, transform 0.4s ease 0.08s;

  .entry.open .entry-body{
    opacity: 1;
    transform: translateY(0);

    padding-left: 1.9rem;

  function renderEntries(entries, container, emptyMessage){
    if(entries.length === 0){
      container.innerHTML = `<p class="empty-note">${emptyMessage}</p>`;
      return;
    }

    entries.forEach((entry) => {
      const item = document.createElement("div");
      item.className = "entry";

      item.innerHTML = `
        <button class="entry-row" aria-expanded="false">
          <span class="entry-mark">&rsaquo;</span>
          <span class="entry-heading">
            <span class="entry-title">${entry.title}</span>
            <span class="entry-preview">${entry.preview || ""}</span>
          </span>
          <span class="entry-date">${entry.date || ""}</span>
        </button>
        <div class="entry-body-wrap">
          <div class="entry-body-inner">
            <p class="entry-body">${entry.body.trim()}</p>
          </div>
        </div>
      `;

      const row = item.querySelector(".entry-row");
      row.addEventListener("click", () => {
        const isOpen = item.classList.contains("open");
        item.classList.toggle("open", !isOpen);
        row.setAttribute("aria-expanded", String(!isOpen));
      });

      container.appendChild(item);
    });
  }

  renderEntries(stories, document.getElementById("story-list"), "");
  renderEntries(poems, document.getElementById("poem-list"), "");
</script>

<script>
  const tracks = [
    { name: "when-she-laughs.mp3", file: "audios/when-she-laughs.mp3" },
    { name: "Placeholder", file: "audio/placeholder.mp3" }
  ];

  const audio = new Audio();
  audio.volume = 0.8;
  let currentTrack = -1;

  const trackListEl = document.getElementById("track-list");
  const volumeSlider = document.getElementById("volume-slider");
  const playlistTab = document.getElementById("playlist-tab");
  const playlistPanel = document.getElementById("playlist-panel");

  const rows = tracks.map((track, i) => {
    const row = document.createElement("div");
    row.className = "track-row";
    row.innerHTML = `
      <button class="track-play" aria-label="Play ${track.name}">▶</button>
      <span class="track-name">${track.name}</span>
    `;
    const btn = row.querySelector(".track-play");
    btn.addEventListener("click", () => {
      if(currentTrack === i && !audio.paused){
        audio.pause();
      } else {
        playTrack(i);
      }
    });
    trackListEl.appendChild(row);
    return row;
  });

  function setPlayingUI(){
    rows.forEach((row, i) => {
      const btn = row.querySelector(".track-play");
      const isThisTrack = i === currentTrack;
      const isPlaying = isThisTrack && !audio.paused;
      row.classList.toggle("playing", isPlaying);
      btn.textContent = isPlaying ? "⏸" : "▶";
    });
  }

  function playTrack(i){
    currentTrack = (i + tracks.length) % tracks.length;
    audio.src = tracks[currentTrack].file;
    audio.play().catch(() => {
    });
    setPlayingUI();
  }

  audio.addEventListener("play", setPlayingUI);
  audio.addEventListener("pause", setPlayingUI);
  audio.addEventListener("ended", () => playTrack(currentTrack + 1));

  volumeSlider.addEventListener("input", () => {
    audio.volume = parseFloat(volumeSlider.value);
  });

  playlistTab.addEventListener("click", () => {
    const isOpen = playlistPanel.classList.toggle("open");
    playlistTab.classList.toggle("shifted", isOpen);
    playlistTab.textContent = isOpen ? "✕ Close" : "♪ Playlist";
  });
</script>
